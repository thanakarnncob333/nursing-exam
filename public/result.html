<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผลสอบและเฉลย | ฝึกทำข้อสอบการพยาบาล</title>
<meta name="description" content="สรุปคะแนนและเฉลยข้อสอบการพยาบาลพร้อมคำอธิบาย">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
.stat-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-top: 14px; }
.stat-item { background: var(--card-solid); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; text-align: center; }
.stat-item .val { font-size: 1.6rem; font-weight: 700; }
.stat-item .lbl { font-size: .82rem; color: var(--muted); margin-top: 2px; }
.action-banner { margin-top: 20px; padding: 18px 20px; border-radius: 16px; background: rgba(14, 159, 142, .08); border: 1px solid rgba(14, 159, 142, .25); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
.btn-next-subject { background: linear-gradient(135deg, #0e9f8e, #0a7b6e); color: #fff; font-weight: 700; padding: 12px 24px; font-size: 1.05rem; }
.btn-star-active { background: rgba(245, 165, 36, .18) !important; color: #d97706 !important; border-color: rgba(245, 165, 36, .4) !important; font-weight: 700 !important; }
</style>
</head>
<body>
<main class="container" id="root"><div class="card empty">กำลังโหลดผลสอบ…</div></main>
<script src="/js/common.js"></script>
<script>
(async () => {
  const me = await initPage(null);
  const id = new URLSearchParams(location.search).get("id");
  const root = document.getElementById("root");
  let r;
  try { r = (await api("/api/exams/" + encodeURIComponent(id))).result; }
  catch (e) { root.innerHTML = `<div class="card"><div class="alert error">${esc(e.message)}</div><a class="btn" href="/home.html">กลับหน้าหลัก</a></div>`; return; }

  const isOwner = r.owner.username === me.user.username;
  const backHref = me.user.role === "admin" && !isOwner ? "/admin.html" : "/home.html";

  if (r.status !== "submitted") {
    root.innerHTML = `<div class="card"><h1>ข้อสอบของ ${esc(r.owner.display_name)}</h1>
      <div class="alert info">ยังไม่ได้ส่งข้อสอบ — ตอบแล้ว ${r.progress.answered}/${r.progress.total} ข้อ</div>
      <a class="btn secondary" href="${backHref}">← กลับ</a></div>`;
    return;
  }

  const pass = r.passed;
  const color = pass ? "var(--ok)" : "var(--bad)";
  const angle = Math.max(0, Math.min(100, r.percent)) * 3.6;
  const durSec = (r.submitted_at && r.started_at) ? Math.max(0, Math.round(r.submitted_at - r.started_at)) : 0;
  const durM = Math.floor(durSec / 60);
  const durS = durSec % 60;
  const durText = `${durM} นาที ${durS} วินาที`;

  const total = r.total;
  const correctCount = r.items.filter(i => i.is_correct).length;
  const answeredCount = r.items.filter(i => i.chosen !== null).length;
  const unCount = total - answeredCount;
  const wrongCount = answeredCount - correctCount;

  const isSingleSub = r.subjects && r.subjects.length === 1;
  const curSub = isSingleSub ? r.subjects[0] : null;
  const curSubId = curSub ? curSub.id : null;
  const nextSubId = (curSubId && curSubId < 9) ? curSubId + 1 : null;
  const allSubs = me.config.subjects || [];
  const nextSubObj = nextSubId ? allSubs.find(s => s.id === nextSubId) : null;

  let headerTitle = "ผลการสอบรวม";
  if (r.mode === "timed_mock") headerTitle = "⏱️ ผลการจำลองสอบเสมือนจริง (50 ข้อ)";
  else if (r.mode === "mistakes") headerTitle = "🎯 ผลการฝึกแก้คลังข้อผิดพลาด";
  else if (r.mode === "starred") headerTitle = "⭐ ผลการทบทวนข้อสอบติดดาว";
  else if (isSingleSub) headerTitle = `ผลสอบวิชาที่ ${curSub.id}: ${esc(curSub.name)}`;

  let modeNotice = "";
  if (r.mode === "mistakes") {
    modeNotice = `<div class="alert ok" style="margin-top:12px">
      🎯 <strong>ระบบคลังข้อผิดพลาด:</strong> ข้อที่คุณตอบถูกต้องในชุดนี้ ได้รับการบันทึกว่าเข้าใจแล้ว และถูกนำออกจากคลังข้อผิดพลาดโดยอัตโนมัติ!
    </div>`;
  }

  root.innerHTML = `
    <section class="card">
      <div class="row between" style="margin-bottom:12px;align-items:flex-start">
        <div>
          <h1 style="margin:0 0 4px 0">${headerTitle}</h1>
          <div class="muted">${esc(r.owner.display_name)} (${esc(r.owner.username)}) · ส่งเมื่อ ${fmtDate(r.submitted_at)} · ใช้เวลา ${durText}</div>
        </div>
        <a class="btn secondary" href="${backHref}">🏠 กลับหน้าหลัก</a>
      </div>

      ${modeNotice}

      <div class="grid cols-2" style="align-items:center;margin-top:14px">
        <div style="text-align:center">
          <div class="score-ring" style="background:conic-gradient(${color} ${angle}deg, rgba(120,140,160,.2) 0);margin:0 auto">
            <div>
              <div class="big" style="color:${color}">${r.score}<span style="font-size:1.2rem" class="muted">/${total}</span></div>
              <div class="muted">${fmtPct(r.percent)}</div>
            </div>
          </div>
          <div style="margin-top:14px">
            <span class="badge ${pass ? "ok" : "bad"}" style="font-size:1rem;padding:6px 18px">
              ${pass ? "✔ ผ่านเกณฑ์" : "✘ ไม่ผ่านเกณฑ์"} (เกณฑ์ ${r.pass_percent}%)
            </span>
          </div>
        </div>

        <div>
          <div style="font-weight:700;font-size:1.05rem;margin-bottom:6px">สรุปสถิติจำนวนข้อ (แสดงหลังทำเสร็จ)</div>
          <div class="stat-box">
            <div class="stat-item"><div class="val" style="color:var(--ok)">${correctCount}</div><div class="lbl">ตอบถูก</div></div>
            <div class="stat-item"><div class="val" style="color:var(--bad)">${wrongCount}</div><div class="lbl">ตอบผิด</div></div>
            <div class="stat-item"><div class="val" style="color:var(--muted)">${unCount}</div><div class="lbl">ไม่ได้ตอบ</div></div>
            <div class="stat-item"><div class="val">${answeredCount}/${total}</div><div class="lbl">ทำไปแล้ว</div></div>
          </div>

          <div style="margin-top:16px">
            <div class="row between" style="margin-bottom:8px">
              <span style="font-weight:600;font-size:.9rem">สถานะรายข้อ (คลิกตัวเลขเพื่อดูเฉลย):</span>
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              ${r.items.map(it => {
                const cls = it.chosen === null ? "badge gray" : (it.is_correct ? "badge ok" : "badge bad");
                return `<a href="#q-review-${it.pos}" onclick="jumpToQ(${it.pos});return false;"
                  class="${cls}" style="display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:30px;padding:0 6px;text-decoration:none;font-weight:700;cursor:pointer">
                  ${it.pos}
                </a>`;
              }).join("")}
            </div>
          </div>
        </div>
      </div>

      <!-- Action Banner สำหรับนำทางไปทำต่อ -->
      <div class="action-banner">
        <div>
          <div style="font-weight:700;font-size:1.05rem">
            ${isSingleSub ? (nextSubObj ? `ขั้นตอนต่อไป: ทำข้อสอบวิชาที่ ${nextSubId}` : "คุณทำครบวิชาสุดท้ายแล้ว!") : "เสร็จสิ้นการประเมินชุดนี้แล้ว"}
          </div>
          <div class="muted" style="font-size:.88rem">
            ${isSingleSub && nextSubObj ? `${esc(nextSubObj.name)} (สุ่ม 20 ข้อ)` : "สามารถเลือกฝึกวิชาอื่น จำลองสอบเสมือนจริง หรือกลับหน้าหลักเพื่อดูผลวิเคราะห์ได้"}
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${isSingleSub && nextSubObj ? `<button class="btn btn-next-subject" id="btn-next-sub">▶ ไปทำวิชาที่ ${nextSubId} ต่อทันที</button>` : ""}
          ${isSingleSub ? `<button class="btn secondary" id="btn-retry-sub">↻ สุ่มทำวิชานี้อีกรอบ</button>` : `<button class="btn secondary" onclick="location.href='/home.html'">ทำชุดอื่นต่อ</button>`}
          <a class="btn ghost" href="/home.html">กลับสู่หน้าหลัก</a>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:18px">
      <div class="row between" style="margin-bottom:12px">
        <h2>เฉลยละเอียดและเหตุผลทางการพยาบาล</h2>
        <span class="muted" style="font-size:.88rem">สามารถกดปุ่ม ⭐ ติดดาวข้อที่สนใจเพื่อเก็บไว้ทบทวนได้ทันที</span>
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="review" style="margin-top:16px"></div>
    </section>`;

  if (document.getElementById("btn-next-sub")) {
    document.getElementById("btn-next-sub").onclick = async () => {
      document.getElementById("btn-next-sub").disabled = true;
      try {
        await api("/api/exam/start", { method: "POST", body: { subject_id: nextSubId, force: true } });
        location.href = "/exam.html";
      } catch (e) {
        toast(e.message, "error");
        document.getElementById("btn-next-sub").disabled = false;
      }
    };
  }

  if (document.getElementById("btn-retry-sub")) {
    document.getElementById("btn-retry-sub").onclick = async () => {
      document.getElementById("btn-retry-sub").disabled = true;
      try {
        await api("/api/exam/start", { method: "POST", body: { subject_id: curSubId, force: true } });
        location.href = "/exam.html";
      } catch (e) {
        toast(e.message, "error");
        document.getElementById("btn-retry-sub").disabled = false;
      }
    };
  }

  /* ---------- แท็บและรายการเฉลย ---------- */
  let filter = "all";
  const tabs = [
    ["all", `ทั้งหมด (${total})`],
    ["wrong", `ข้อที่ผิด (${wrongCount + unCount})`],
    ["right", `ข้อที่ถูก (${correctCount})`]
  ];

  function renderTabs() {
    const t = document.getElementById("tabs");
    t.innerHTML = tabs.map(([k, l]) => `<button class="tab ${k === filter ? "active" : ""}" data-k="${k}">${esc(l)}</button>`).join("");
    t.querySelectorAll(".tab").forEach(b => b.onclick = () => { filter = b.dataset.k; renderTabs(); renderReview(); });
  }

  window.toggleStar = async (qid, btn) => {
    const isStarred = btn.textContent.includes("★");
    const nextStarred = !isStarred;
    try {
      await api("/api/star", { method: "POST", body: { q_id: qid, starred: nextStarred } });
      if (nextStarred) {
        btn.textContent = "★ ติดดาวแล้ว";
        btn.classList.add("btn-star-active");
        toast("⭐ บันทึกข้อสอบไว้ในคลังติดดาวแล้ว", "info");
      } else {
        btn.textContent = "☆ ติดดาว";
        btn.classList.remove("btn-star-active");
        toast("นำดาวออกจากข้อสอบแล้ว", "info");
      }
    } catch(e) { toast(e.message, "error"); }
  };

  function renderReview() {
    const list = r.items.filter(i => filter === "all" || (filter === "wrong" && !i.is_correct) || (filter === "right" && i.is_correct));
    document.getElementById("review").innerHTML = list.length ? list.map(it => `
      <article id="q-review-${it.pos}" class="review-item ${it.is_correct ? "is-ok" : "is-bad"}" style="margin-bottom:18px;scroll-margin-top:20px">
        <div class="row between" style="margin-bottom:8px">
          <span class="q-subject" style="font-weight:600">วิชาที่ ${it.subject_id}: ${esc(it.subject)}</span>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="btn ghost sm ${it.starred ? "btn-star-active" : ""}" onclick="toggleStar('${it.q_id}', this)" style="padding:4px 10px;font-size:.82rem">
              ${it.starred ? "★ ติดดาวแล้ว" : "☆ ติดดาว"}
            </button>
            <span class="badge ${it.is_correct ? "ok" : "bad"}">${it.chosen === null ? "ไม่ได้ตอบ" : it.is_correct ? "✔ ถูกต้อง" : "✘ ตอบผิด"}</span>
          </div>
        </div>
        <div class="q-text" style="font-size:1.02rem;line-height:1.6;margin-bottom:12px"><strong>ข้อที่ ${it.pos}.</strong> ${esc(it.q)}</div>
        <div id="choices">${it.choices.map((c, i) => `<div class="choice review ${i === it.correct ? "correct" : i === it.chosen ? "wrong" : ""}">
          <span class="key">${KEYS[i]}</span><span>${esc(c)}
          ${i === it.correct ? ' <strong>✔ (คำตอบที่ถูกต้อง)</strong>' : ""}${i === it.chosen && i !== it.correct ? ' <strong>← คำตอบของคุณ</strong>' : ""}</span>
        </div>`).join("")}</div>
        <div class="explain" style="margin-top:12px;padding:12px 14px;border-radius:10px;background:rgba(14, 159, 142, .08);border-left:4px solid var(--primary)">
          <strong>เฉลย: ข้อ ${KEYS[it.correct]}</strong><br>
          <div style="margin-top:6px;line-height:1.6">${esc(it.explanation || "ไม่มีคำอธิบาย")}</div>
        </div>
      </article>`).join("") : '<div class="empty">ไม่มีข้อสอบในหมวดนี้</div>';
  }

  window.jumpToQ = function(pos) {
    if (filter !== "all") {
      filter = "all";
      renderTabs();
      renderReview();
    }
    const el = document.getElementById("q-review-" + pos);
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.style.transition = "transform 0.25s, box-shadow 0.25s";
      el.style.transform = "scale(1.02)";
      el.style.boxShadow = "0 0 0 3px var(--primary)";
      setTimeout(() => {
        el.style.transform = "none";
        el.style.boxShadow = "none";
      }, 1500);
    }
  };

  renderTabs();
  renderReview();
})().catch(e => { if (e.status !== 401) console.error(e); });
</script>
</body>
</html>
