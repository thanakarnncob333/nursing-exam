<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทำข้อสอบ | ฝึกทำข้อสอบการพยาบาล</title>
<meta name="description" content="หน้าทำข้อสอบการพยาบาล">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e9f8e">
<style>
.exam-wrap { max-width: 820px; margin: 0 auto; }
.q-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.q-sub-badge { font-size: .88rem; font-weight: 600; color: var(--primary); background: rgba(14, 159, 142, .12); padding: 5px 14px; border-radius: 999px; }
.q-timer-badge { font-size: .92rem; color: var(--muted); font-weight: 600; transition: color .2s; }
.q-timer-badge.urgent { color: var(--bad); font-weight: 800; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .55; } }
.q-status-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: .92rem; }
.q-card-main { padding: 22px 24px; }
@media (max-width: 640px) {
  .q-card-main { padding: 16px 16px; }
  .q-nav { flex-direction: column; gap: 10px; }
  .q-nav > div { width: 100%; display: flex; gap: 8px; }
  .q-nav > div > button { flex: 1; justify-content: center; }
  .btn-submit-main { width: 100%; justify-content: center; }
}
.btn-submit-main { background: linear-gradient(135deg, #0e9f8e, #0a7b6e); color: #fff; font-weight: 700; box-shadow: 0 8px 18px -6px rgba(14, 159, 142, .8); }
.btn-submit-main:hover { background: linear-gradient(135deg, #10b8a4, #0e9f8e); }
.btn-star-active { background: rgba(245, 165, 36, .18) !important; color: #d97706 !important; border-color: rgba(245, 165, 36, .4) !important; font-weight: 700 !important; }
</style>
</head>
<body>
<div class="top-progress-bar"><div class="top-progress-fill" id="top-progress-fill"></div></div>
<main class="container">
  <div class="exam-wrap">
    <div class="card q-card-main" id="q-card">
      <div class="empty">กำลังโหลดข้อสอบ…</div>
    </div>
  </div>
</main>
<script src="/js/common.js"></script>
<script>
(async () => {
  await initPage("exam");
  const res = await api("/api/exam/current");
  if (!res.exam) { location.href = "/home.html"; return; }
  const exam = res.exam, items = exam.items;
  let cur = 0;
  const pending = new Map(); // pos -> patch
  let submitting = false;
  let warnedUrgent = false;

  const startedAt = exam.started_at || (Date.now() / 1000);
  const isTimedMock = exam.mode === "timed_mock" && exam.time_limit > 0;

  function updateTimer() {
    const t = document.getElementById("timer-text");
    if (!t) return;
    if (isTimedMock) {
      const remaining = Math.max(0, Math.floor((startedAt + exam.time_limit) - Date.now() / 1000));
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      const str = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      t.textContent = `⏱ เหลือเวลา ${str}`;
      if (remaining <= 300) { // < 5 minutes
        t.classList.add("urgent");
        if (!warnedUrgent && remaining > 0) {
          warnedUrgent = true;
          toast("⚠️ เหลือเวลาทำข้อสอบอีกไม่ถึง 5 นาที! กรุณาตรวจทานและตอบให้ครบทุกข้อ", "warn");
        }
      } else {
        t.classList.remove("urgent");
      }
      if (remaining <= 0 && !submitting) {
        toast("หมดเวลาทำข้อสอบแล้ว!", "error");
      }
    } else {
      const elapsed = Math.max(0, Math.floor(Date.now() / 1000 - startedAt));
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      const str = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      t.textContent = `⏱ ${str}`;
    }
  }
  setInterval(updateTimer, 1000);

  const $ = id => document.getElementById(id);
  const startHash = parseInt((location.hash.match(/q=(\d+)/) || [])[1], 10);
  if (startHash >= 1 && startHash <= items.length) cur = startHash - 1;
  else { const firstUn = items.findIndex(i => i.chosen === null); cur = firstUn >= 0 ? firstUn : 0; }

  /* ---------- บันทึกคำตอบ ---------- */
  async function flush() {
    if (!pending.size) { updateSaveBadge("✓ บันทึกแล้ว"); return; }
    const entries = [...pending.entries()];
    updateSaveBadge("กำลังบันทึก…");
    for (const [pos, change] of entries) {
      try {
        await api("/api/exam/answer", { method: "POST", body: { exam_id: exam.id, pos, ...change } });
        if (pending.get(pos) === change) pending.delete(pos);
      } catch (e) {
        if (e.status === 409 || e.status === 404) { toast(e.message, "error"); setTimeout(() => location.href = "/home.html", 1500); return; }
        updateSaveBadge("⚠ รอเชื่อมต่อ…");
        return;
      }
    }
    updateSaveBadge(pending.size ? "กำลังบันทึก…" : "✓ บันทึกแล้ว");
  }
  setInterval(flush, 4000);
  window.addEventListener("beforeunload", e => { if (pending.size && !submitting) { e.preventDefault(); e.returnValue = ""; } });

  function queue(pos, patch) {
    const prev = pending.get(pos) || {};
    pending.set(pos, { ...prev, ...patch });
    flush();
  }

  function updateSaveBadge(txt) {
    const el = $("save-state");
    if (el) el.textContent = txt;
  }

  /* ---------- แสดงผลข้อสอบทีละข้อ (Mobile-first พร้อม Top Progress Bar) ---------- */
  function updateProgressSummary() {
    const answered = items.filter(i => i.chosen !== null).length;
    const un = items.length - answered;
    const pct = items.length > 0 ? (answered / items.length) * 100 : 0;
    const topFill = $("top-progress-fill");
    if (topFill) topFill.style.width = pct + "%";

    const pEl = $("progress-text");
    if (pEl) pEl.textContent = un === 0 ? `(ตอบครบแล้ว ${answered}/${items.length})` : `(ตอบแล้ว ${answered}/${items.length})`;
    const sBtn = $("btn-submit");
    if (sBtn) {
      sBtn.textContent = un === 0 ? "✔ ส่งข้อสอบ & ดูเฉลยทันที" : `ส่งข้อสอบ & ดูเฉลย (เหลือ ${un} ข้อ)`;
    }
  }

  function renderQuestion() {
    const it = items[cur];
    const isLast = cur === items.length - 1;
    const answeredCount = items.filter(i => i.chosen !== null).length;
    const unCount = items.length - answeredCount;
    it.eliminated = it.eliminated || [];

    let modeTag = "";
    if (exam.mode === "timed_mock") modeTag = " · ⏱️ จำลองสอบเสมือนจริง";
    else if (exam.mode === "mistakes") modeTag = " · 🎯 คลังข้อผิดพลาด";
    else if (exam.mode === "starred") modeTag = " · ⭐ ทบทวนข้อติดดาว";

    $("q-card").innerHTML = `
      <div class="q-header">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="q-sub-badge">วิชาที่ ${it.subject_id}: ${esc(it.subject)}${modeTag}</span>
          <button class="btn ghost sm" id="btn-quick-labs" style="gap:5px" title="เปิดตารางค่าแล็บปกติฉุกเฉิน">
            <span>📋</span> ค่าแล็บปกติ
          </button>
        </div>
        <div class="row" style="gap:12px;align-items:center">
          <div class="font-ctrl" title="ปรับขนาดตัวอักษร">
            <button type="button" class="btn-font" data-size="sm" title="ตัวอักษรเล็ก">A-</button>
            <button type="button" class="btn-font" data-size="md" title="ตัวอักษรปกติ">A</button>
            <button type="button" class="btn-font" data-size="lg" title="ตัวอักษรใหญ่">A+</button>
          </div>
          <span class="q-timer-badge" id="timer-text">⏱ 00:00</span>
          <span class="savebadge" id="save-state">✓ บันทึกแล้ว</span>
        </div>
      </div>
      <div class="q-status-line">
        <div>
          <strong>ข้อที่ ${cur + 1} / ${items.length}</strong>
          <span id="progress-text" style="font-size:.84rem;color:var(--muted);margin-left:6px">
            ${unCount === 0 ? `(ตอบครบแล้ว ${answeredCount}/${items.length})` : `(ตอบแล้ว ${answeredCount}/${items.length})`}
          </span>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn ghost sm ${it.starred ? "btn-star-active" : ""}" id="btn-star">
            ${it.starred ? "★ ติดดาวแล้ว" : "☆ ติดดาว"}
          </button>
          <button class="btn ghost sm" id="btn-flag">
            ${it.flagged ? "🚩 ทำเครื่องหมายไว้" : "⚐ ทบทวน"}
          </button>
        </div>
      </div>
      <div class="q-text" style="line-height:1.65;margin:14px 0">${esc(it.q)}</div>
      <div id="choices" style="margin-top:16px">${it.choices.map((c, i) => {
        const isElim = it.eliminated.includes(i);
        const isSel = it.chosen === i;
        return `
          <div class="choice-wrap" id="wrap-choice-${i}">
            <button type="button" class="choice ${isSel ? "selected" : ""} ${isElim ? "eliminated" : ""}" data-i="${i}">
              <span class="key">${KEYS[i]}</span><span class="choice-text">${esc(c)}</span>
            </button>
            <button type="button" class="btn-strike ${isElim ? "active" : ""}" data-strike="${i}" title="${isElim ? "ยกเลิกการขีดฆ่าตัวเลือกนี้" : "ขีดฆ่าตัดช้อยส์นี้ (Eliminate)"}">
              ${isElim ? "↩" : "✕"}
            </button>
          </div>`;
      }).join("")}
      </div>
      <div class="q-nav" style="margin-top:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap">
        <div style="display:flex;gap:8px">
          <button class="btn secondary" id="btn-prev" ${cur === 0 ? "disabled" : ""}>← ข้อก่อนหน้า</button>
          <button class="btn ghost" id="btn-clear" ${it.chosen === null ? "disabled" : ""}>ล้างคำตอบ</button>
          <button class="btn" id="btn-next" ${isLast ? "disabled" : ""}>ข้อถัดไป →</button>
        </div>
        <button class="btn btn-submit-main" id="btn-submit">
          ${unCount === 0 ? "✔ ส่งข้อสอบ & ดูเฉลยทันที" : `ส่งข้อสอบ & ดูเฉลย (เหลือ ${unCount} ข้อ)`}
        </button>
      </div>
      <div class="muted hide-sm" style="font-size:.78rem;margin-top:12px;text-align:right">
        💡 คีย์ลัด: [1-4] เลือกคำตอบ · [← / →] เลื่อนข้อ · [✕] ขีดฆ่าตัดช้อยส์
      </div>`;

    $("choices").querySelectorAll(".choice").forEach(b => b.onclick = () => choose(+b.dataset.i));
    $("choices").querySelectorAll(".btn-strike").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const idx = +b.dataset.strike;
      it.eliminated = it.eliminated || [];
      if (it.eliminated.includes(idx)) {
        it.eliminated = it.eliminated.filter(x => x !== idx);
      } else {
        it.eliminated.push(idx);
      }
      renderQuestion();
    });

    $("q-card").querySelectorAll(".btn-font").forEach(b => b.onclick = () => setFontScale(b.dataset.size));
    const btnQuickLabs = $("btn-quick-labs");
    if (btnQuickLabs) btnQuickLabs.onclick = openLabDrawer;

    $("btn-prev").onclick = () => go(cur - 1);
    $("btn-next").onclick = () => go(cur + 1);
    $("btn-clear").onclick = () => choose(null);
    $("btn-flag").onclick = () => { it.flagged = !it.flagged; queue(it.pos, { flagged: it.flagged }); renderQuestion(); };

    // Toggle Star
    $("btn-star").onclick = async () => {
      const nextStarred = !it.starred;
      try {
        await api("/api/star", { method: "POST", body: { q_id: it.q_id, starred: nextStarred } });
        it.starred = nextStarred;
        toast(it.starred ? "⭐ บันทึกข้อสอบนี้ไว้ในคลังติดดาวแล้ว" : "นำข้อสอบออกจากคลังติดดาวแล้ว", "info");
        renderQuestion();
      } catch (e) { toast(e.message, "error"); }
    };

    $("btn-submit").onclick = submitExam;
    updateTimer();
    updateProgressSummary();
    initFontScale();
    history.replaceState(null, "", "#q=" + (cur + 1));
  }

  function go(i) {
    if (i < 0 || i >= items.length) return;
    cur = i;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function choose(i) {
    const it = items[cur];
    if (i !== null && it.eliminated && it.eliminated.includes(i)) {
      it.eliminated = it.eliminated.filter(x => x !== i);
    }
    it.chosen = i;
    queue(it.pos, { chosen: i });
    renderQuestion();
  }

  document.addEventListener("keydown", e => {
    if (document.querySelector(".modal-back") || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight") go(cur + 1);
    else if (e.key === "ArrowLeft") go(cur - 1);
    else if (/^[1-4]$/.test(e.key)) { if (items[cur].choices[+e.key - 1] !== undefined) choose(+e.key - 1); }
  });

  /* ---------- ส่งข้อสอบ & ตรวจเฉลยทันที (ป้องกันการโกง: ต้องตอบครบทุกข้อ) ---------- */
  async function submitExam() {
    await flush();
    if (pending.size) { toast("ยังบันทึกคำตอบไม่ครบ กรุณารอสักครู่แล้วลองใหม่", "error"); return; }
    const un = items.filter(i => i.chosen === null).length;
    if (un > 0) {
      const firstUn = items.findIndex(i => i.chosen === null);
      await alertBox(
        "⚠️ ยังทำข้อสอบไม่ครบทุกข้อ",
        `คุณตอบไปแล้ว ${items.length - un} จากทั้งหมด ${items.length} ข้อ\n(ยังเหลืออีก ${un} ข้อที่ยังไม่ได้ตอบ)\n\nระบบไม่อนุญาตให้ส่งข้อสอบก่อนตอบครบทุกข้อ เพื่อป้องกันการเปิดดูเฉลยก่อนทำเสร็จ\n\n(กดปุ่มด้านล่างเพื่อไปยังข้อที่ ${firstUn + 1} ทันที)`,
        `ไปทำข้อที่ ${firstUn + 1}`
      );
      go(firstUn);
      return;
    }

    const flagged = items.filter(i => i.flagged).length;
    let msg = `คุณตอบครบทั้ง ${items.length} ข้อเรียบร้อยแล้ว`;
    if (flagged > 0) msg += `\n🚩 มี ${flagged} ข้อที่ทำเครื่องหมายทบทวนไว้`;
    msg += "\n\nเมื่อส่งแล้วระบบจะตรวจคะแนนและแสดงเฉลยละเอียดพร้อมเหตุผลทันที";
    if (!await confirmBox("ยืนยันส่งข้อสอบชุดนี้?", msg, "ส่งข้อสอบ & ดูเฉลย")) return;
    const btn = $("btn-submit");
    if (btn) btn.disabled = true;
    try {
      submitting = true;
      const r = await api("/api/exam/submit", { method: "POST", body: { exam_id: exam.id } });
      location.href = "/result.html?id=" + r.exam_id;
    } catch (e) {
      submitting = false;
      toast(e.message, "error");
      if (btn) btn.disabled = false;
    }
  }

  renderQuestion();
})().catch(e => { if (e.status !== 401) { console.error(e); toast(e.message, "error"); } });
</script>
</body>
</html>
